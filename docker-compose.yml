networks:
  vault_network:
    name: vault_network
    driver: bridge

volumes:
  postgres_data:
    name: vault_postgres_data
  redis_data:
    name: vault_redis_data
  clamav_data:
    name: vault_clamav_data
  minio_data:
    name: vault_minio_data

services:
  redis:
    image: redis:7-alpine
    container_name: vault_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vault_network

  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
    container_name: vault_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-vault_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vault_user} -d ${POSTGRES_DB:-vault_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vault_network

  clamav:
    image: clamav/clamav:stable
    platform: linux/amd64
    container_name: vault_clamav
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - vault_network

  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: vault_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vault_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vault_minio_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vault_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vault_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vault_user}:${POSTGRES_PASSWORD:-vault_secure_password}@db:5432/${POSTGRES_DB:-vault_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-105470440264-7ep9hin2tddk14jba8agmbddbcl6j12r.apps.googleusercontent.com}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-super-secure-random-secret-key-in-prod}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-384}
      SAM_API_URL: ${SAM_API_URL:-http://host.docker.internal:3001}
      SAM_LAMBDA_ENDPOINT_URL: ${SAM_LAMBDA_ENDPOINT_URL:-http://host.docker.internal:3002}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-vault_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-vault_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-vault-uploads}
      S3_QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:-vault-quarantine}
      S3_SECURED_BUCKET: ${S3_SECURED_BUCKET:-vault-secured}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      FILE_LOG_DIR: /app/logs
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-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}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      ANTHROPIC_SONNET_MODEL: ${ANTHROPIC_SONNET_MODEL:-claude-sonnet-4-5-20250929}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vault_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vault_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - vault_network

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: vault_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - backend
      - frontend
    networks:
      - vault_network
